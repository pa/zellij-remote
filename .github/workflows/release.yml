name: Release

# Push a tag like v0.1.0 to publish binaries:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          build() { # goos goarch
            local dir="zellij-remote_${VERSION}_$1_$2"
            mkdir -p "dist/$dir"
            CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/$dir/zellij-remote" ./cmd/zellij-remote
            cp LICENSE README.md "dist/$dir/"
            tar -C dist -czf "dist/$dir.tar.gz" "$dir"
            rm -rf "dist/$dir"
          }
          build darwin arm64
          build darwin amd64
          build linux amd64
          build linux arm64
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          ls -la dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/checksums.txt --generate-notes --title "${{ github.ref_name }}"
