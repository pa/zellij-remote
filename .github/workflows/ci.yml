name: CI

# Runs on every pull request and every push to main. Branch protection
# should require the "ci-ok" check, which passes only when every job does.
# When only docs change (Markdown, docs/, LICENSE, the PR template,
# Dependabot config), the build and test jobs are skipped and ci-ok still
# passes. The secret scan always runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZELLIJ_VERSION: v0.45.1
  # sha256 of zellij-x86_64-unknown-linux-musl.tar.gz for ZELLIJ_VERSION.
  # Bump both together; a mismatch fails the integration job.
  ZELLIJ_SHA256: 40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  changes:
    name: Code changed?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A manual run, or a push with no previous commit, runs everything.
          range=
          case $EVENT in
          pull_request) range="$PR_BASE...$PR_HEAD" ;;
          push) [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ] || range="$PUSH_BEFORE..$PUSH_AFTER" ;;
          esac
          if [ -z "$range" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Anything not on this list counts as code.
          code=$(git diff --name-only "$range" | grep -Ev '\.md$|^docs/|^LICENSE$|^\.github/pull_request_template\.md$|^\.github/dependabot\.yml$' || true)
          if [ -n "$code" ]; then
            echo "Code changed:"; echo "$code"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; skipping build and tests."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  secrets:
    name: No secrets in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-secrets.sh --history

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt, tidy modules, shellcheck
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go mod tidy && git diff --exit-code go.mod go.sum
          go mod verify
          shellcheck scripts/*.sh .githooks/*
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o zellij-remote ./cmd/zellij-remote && ./zellij-remote version

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Against a real zellij web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Only the test job saves the build cache, so it stays complete.
          cache: false
      - name: Install zellij ${{ env.ZELLIJ_VERSION }} (checksum pinned)
        run: |
          set -euo pipefail
          f=zellij-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL -o "$f" "https://github.com/zellij-org/zellij/releases/download/${ZELLIJ_VERSION}/$f"
          echo "${ZELLIJ_SHA256}  $f" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$f" -C "$HOME/.local/bin" zellij
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run the proxy against zellij web
        run: |
          set -euo pipefail
          zellij --version
          # zellij web exits at once when no config folder exists, and a
          # fresh runner has never run zellij in a terminal to create one.
          # zellij-remote run does the same before starting zellij web.
          mkdir -p "$HOME/.config/zellij"
          zellij web --port 18082 > zellij-web.log 2>&1 &
          web=$!
          # Wait until it answers, or stop early if it exits.
          ready=
          for _ in $(seq 1 180); do
            if curl -fs -o /dev/null http://127.0.0.1:18082/; then ready=1; break; fi
            kill -0 "$web" 2>/dev/null || break
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::zellij web didn't answer"
            if ! kill -0 "$web" 2>/dev/null; then
              set +e; wait "$web"; echo "zellij web exited with status $?"; set -e
            fi
            echo "--- zellij web log"; cat zellij-web.log
            echo "--- XDG_RUNTIME_DIR"; ls -ld "${XDG_RUNTIME_DIR:-/nonexistent}" 2>&1 || true
            echo "--- zellij's own logs"
            find /tmp "${XDG_RUNTIME_DIR:-/nonexistent}" -path '*zellij*' -name '*.log' 2>/dev/null | while read -r f; do echo "== $f"; tail -40 "$f"; done
            echo "--- processes"; pgrep -a zellij || echo "no zellij process"
            echo "--- listening"; ss -ltnp 2>/dev/null | grep -E '18082|zellij' || echo "nothing on 18082"
            echo "--- curl"; curl -sv --max-time 5 http://127.0.0.1:18082/ -o /dev/null 2>&1 | tail -15 || true
            echo "--- env"; echo "TERM=${TERM-unset} SHELL=${SHELL-unset} XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR-unset} TMPDIR=${TMPDIR-unset}"
            exit 1
          fi
          echo "zellij web answered after ${SECONDS}s"
          # The token lives only in this step's shell, masked from the log,
          # and is revoked afterwards.
          out=$(zellij web --create-token | grep '^token_')
          echo "::add-mask::${out#*: }"
          trap 'zellij web --revoke-token "${out%%:*}" || true' EXIT
          ZELLIJ_IT_URL=http://127.0.0.1:18082 ZELLIJ_IT_TOKEN="${out#*: }" \
            go test ./internal/proxy -run RealZellij -count=1 -v
      - name: zellij web log
        if: failure()
        run: cat zellij-web.log || true

  vuln:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Only the test job saves the build cache, so it stays complete.
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}" ./...

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, secrets, test, integration, vuln]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped because only docs changed
        env:
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          ok='.result == "success"'
          if [ "$CODE" = false ]; then ok='.result == "success" or .result == "skipped"'; fi
          echo '${{ toJSON(needs) }}' | jq -e "(.changes.result == \"success\") and all(.[]; $ok)" > /dev/null || {
            echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
            exit 1
          }
